name: Deploy Backend to VPS

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend-vps.yml"
  workflow_dispatch:

concurrency:
  group: backend-vps-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Package backend
        run: |
          tar \
            --exclude='.env' \
            --exclude='vendor' \
            --exclude='node_modules' \
            --exclude='public/build' \
            --exclude='storage/logs' \
            --exclude='storage/framework/cache' \
            --exclude='storage/framework/sessions' \
            --exclude='storage/framework/views' \
            --exclude='bootstrap/cache/*.php' \
            -czf backend-deploy.tar.gz \
            -C backend .

      - name: Upload backend package
        run: |
          scp -i ~/.ssh/vps_key backend-deploy.tar.gz \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/backend-deploy.tar.gz"

      - name: Deploy on VPS
        run: |
          ssh -i ~/.ssh/vps_key "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'SSH'
          set -euo pipefail

          APP_DIR="/var/www/employee-training-web/backend"
          BACKUP_DIR="/var/www/employee-training-web/releases"
          RELEASE_ID="$(date +%Y%m%d%H%M%S)"

          mkdir -p "$APP_DIR" "$BACKUP_DIR"

          if [ -f "$APP_DIR/.env" ]; then
            cp "$APP_DIR/.env" "/tmp/employee-training.env"
          fi

          tar -xzf /tmp/backend-deploy.tar.gz -C "$APP_DIR"

          if [ -f /tmp/employee-training.env ]; then
            mv /tmp/employee-training.env "$APP_DIR/.env"
          fi

          cd "$APP_DIR"

          mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache

          if ! composer install --no-dev --optimize-autoloader --no-interaction; then
            composer update --no-dev --optimize-autoloader --no-interaction
          fi

          npm install
          npm run build

          php artisan migrate --force
          php artisan storage:link || true
          php artisan config:clear
          php artisan route:clear
          php artisan cache:clear
          php artisan config:cache
          php artisan route:cache

          sudo chown -R ubuntu:www-data /var/www/employee-training-web/backend
          sudo chmod -R 775 storage bootstrap/cache

          sudo supervisorctl restart employee-training-worker:* || true
          sudo systemctl reload php8.3-fpm
          sudo systemctl reload nginx

          rm -f /tmp/backend-deploy.tar.gz
          echo "$RELEASE_ID" > "$BACKUP_DIR/latest-backend-deploy.txt"
          SSH
